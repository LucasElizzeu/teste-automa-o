# =============================================================================
# Configuracao do sistema de monitoramento operacional
# =============================================================================
# Este arquivo NAO contem segredos. Usuario, senha e tokens ficam no .env.
# =============================================================================

# ---------------------------------------------
# Agendamento
# ---------------------------------------------
schedule:
  mode: "cron"
  times:
    - "08:00"
    - "09:00"
    - "10:00"
    - "11:00"
    - "12:00"
    - "13:00"
    - "14:00"
    - "15:00"
    - "16:00"
    - "17:00"
    - "18:00"
    - "19:00"
  every_hours: []
  timezone: "America/Manaus"

# ---------------------------------------------
# Navegador (Playwright)
# ---------------------------------------------
browser:
  headless: true
  viewport_width: 2000
  viewport_height: 2000
  device_scale_factor: 1
  navigation_timeout_ms: 60000
  element_timeout_ms: 30000
  extra_settle_seconds: 4
  locale: "pt-BR"
  user_agent: null

# ---------------------------------------------
# Autenticacao / sessoes
# ---------------------------------------------
auth:
  reuse_session: true
  session_max_age_hours: 12
  retry_attempts: 3
  retry_backoff_seconds: [10, 20]

# ---------------------------------------------
# Saida de imagens
# ---------------------------------------------
# Sem recorte global: cada site define o seu proprio `crop_region`.
output:
  screenshot_retention_days: 7
  filename_pattern: "{date}_{time}_{site}_{system}.png"
  add_label_banner: false
  crop_region: null

# ---------------------------------------------
# Sistemas / dashboards
# ---------------------------------------------
systems:
  grafana:
    login_url: "http://45.190.21.30:3666/login"
    login:
      username_selector: 'input[name="user"]'
      password_selector: 'input[name="password"]'
      submit_selector: 'button[aria-label="Login button"]'
      success_selector: null
      logged_in_url_contains: "/d/"
    panel:
      container_selector: '.react-grid-layout'
      ready_selector: null
      error_selector: '[role="alert"]'
    filters:
      time_picker_selector: null
      presets: {}

# ---------------------------------------------
# Sites / dashboards
# ---------------------------------------------
